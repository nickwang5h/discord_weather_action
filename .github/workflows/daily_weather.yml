name: Daily Weather Push to Discord

on:
  # 已归档：定时调度已迁移至 VPS discord-bot，此处关闭 GitHub Actions 自动调度
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch: # 仅保留手动触发供历史测试参考

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # 因为代码只用到了 requests，所以直接 pip install 即可
        run: pip install requests

      - name: Run Python Script
        # 将 GitHub Secrets 和 配置信息注入为环境变量
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 在这里配置你的城市，用逗号分隔 (支持任意多个城市)
          CITIES: "Ottawa,Sudbury"
        run: python main.py