name: Daily Weather Push to Discord

on:
  schedule:
    # 这里的 cron 使用的是 UTC 时间。
    # UTC 11:00 大约等于加东时间 (EDT) 早上 07:00。
    - cron: '0 11 * * *'
  workflow_dispatch: # 加上这一行，允许你在 GitHub 页面手动点击运行，方便测试

jobs:
  run-weather-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # 因为代码只用到了 requests，所以直接 pip install 即可
        run: pip install requests

      - name: Run Python Script
        # 将 GitHub Secrets 和 配置信息注入为环境变量
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 在这里配置你的城市，用逗号分隔 (支持任意多个城市)
          CITIES: "Ottawa,Sudbury"
        run: python main.py